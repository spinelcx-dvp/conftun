<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل کانفیگ V2Ray</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 2px solid rgba(255,255,255,0.1);
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 2.5rem;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p { color: #888; margin-top: 10px; }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .stat-card .value {
    font-size: 2rem;
    font-weight: bold;
    color: #00d2ff;
  }
  .stat-card .label { color: #aaa; font-size: 0.85rem; margin-top: 8px; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn:hover { opacity: 0.9; transform: translateY(-2px); }
  .search-box {
    flex: 1;
    min-width: 200px;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 0.95rem;
  }
  .search-box::placeholder { color: #666; }
  .configs-list {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 10px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .config-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    gap: 10px;
    flex-wrap: wrap;
  }
  .config-item:hover { background: rgba(255,255,255,0.03); }
  .config-item:last-child { border-bottom: none; }
  .config-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 250px;
  }
  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    white-space: nowrap;
  }
  .badge-vless { background: rgba(0,210,255,0.2); color: #00d2ff; }
  .badge-vmess { background: rgba(138,43,226,0.2); color: #b57edc; }
  .badge-trojan { background: rgba(255,99,71,0.2); color: #ff6347; }
  .badge-ss { background: rgba(255,215,0,0.2); color: #ffd700; }
  .badge-active { background: rgba(0,210,100,0.2); color: #00d264; }
  .latency {
    font-family: monospace;
    color: #00d264;
    font-size: 0.85rem;
  }
  .host {
    font-family: monospace;
    font-size: 0.85rem;
    color: #ccc;
    word-break: break-all;
  }
  .copy-btn {
    padding: 6px 14px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .copy-btn:hover { background: rgba(0,210,255,0.3); }
  .copy-btn.copied { background: rgba(0,210,100,0.3); }
  .empty {
    text-align: center;
    color: #888;
    padding: 60px 20px;
  }
  .loading {
    text-align: center;
    color: #888;
    padding: 40px;
  }
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #00d2ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .pagination button {
    padding: 8px 14px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .pagination button.active {
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
  }
  .pagination button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 پنل کانفیگ V2Ray</h1>
    <p>جمع‌آوری خودکار از گیت‌هاب و سابسکریپشن‌ها • بروزرسانی هر ۱۰ دقیقه</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="value" id="stat-active">-</div>
      <div class="label">کانفیگ‌های فعال</div>
    </div>
    <div class="stat-card">
      <div class="value" id="stat-tested">-</div>
      <div class="label">کل تست‌شده‌ها</div>
    </div>
    <div class="stat-card">
      <div class="value" id="stat-avg">-</div>
      <div class="label">میانگین پینگ (ms)</div>
    </div>
    <div class="stat-card">
      <div class="value" id="stat-last">-</div>
      <div class="label">آخرین بروزرسانی</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="loadData()">🔄 بروزرسانی</button>
    <button class="btn btn-secondary" onclick="copyAll()">📋 کپی همه</button>
    <button class="btn btn-secondary" onclick="downloadSub()">⬇️ دانلود Subscription</button>
    <input 
      type="text" 
      class="search-box" 
      placeholder="🔍 جستجو بر اساس پروتکل، هاست یا پورت..."
      id="searchBox"
      oninput="renderList()"
    >
  </div>

  <div class="configs-list" id="configsList">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top:10px;">در حال بارگذاری...</p>
    </div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<script>
// ========== تنظیمات ==========
const ITEMS_PER_PAGE = 50;
let allConfigs = [];
let filteredConfigs = [];
let currentPage = 1;

// ========== بارگذاری داده ==========
async function loadData() {
  const list = document.getElementById('configsList');
  list.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:10px;">در حال بارگذاری...</p></div>';
  
  try {
    // اضافه کردن cache-busting
    const res = await fetch('results.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    
    const data = await res.json();
    allConfigs = data.active || [];
    
    // آپدیت آمار
    document.getElementById('stat-active').textContent = allConfigs.length;
    document.getElementById('stat-tested').textContent = data.stats?.total_tested || 0;
    
    const avgLatency = allConfigs.length > 0
      ? Math.round(allConfigs.reduce((s, c) => s + (c.latency || 0), 0) / allConfigs.length)
      : 0;
    document.getElementById('stat-avg').textContent = avgLatency + ' ms';
    
    if (data.stats?.last_scan) {
      const date = new Date(data.stats.last_scan);
      document.getElementById('stat-last').textContent = 
        date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    }
    
    renderList();
  } catch (e) {
    console.error('Load error:', e);
    list.innerHTML = `<div class="empty">
      ❌ خطا در بارگذاری: ${e.message}
      <br><br>
      <small style="color:#666">ممکنه results.json هنوز ساخته نشده باشه. منتظر اولین اجرای اسکنر باش.</small>
    </div>`;
  }
}

// ========== رندر لیست ==========
function renderList() {
  const query = document.getElementById('searchBox').value.toLowerCase().trim();
  const list = document.getElementById('configsList');
  
  filteredConfigs = query
    ? allConfigs.filter(c => 
        c.protocol?.toLowerCase().includes(query) ||
        c.host?.toLowerCase().includes(query) ||
        String(c.port).includes(query) ||
        c.network?.toLowerCase().includes(query)
      )
    : allConfigs;
  
  if (filteredConfigs.length === 0) {
    list.innerHTML = '<div class="empty">📭 هیچ کانفیگی پیدا نشد</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  
  const totalPages = Math.ceil(filteredConfigs.length / ITEMS_PER_PAGE);
  if (currentPage > totalPages) currentPage = 1;
  
  const start = (currentPage - 1) * ITEMS_PER_PAGE;
  const pageItems = filteredConfigs.slice(start, start + ITEMS_PER_PAGE);
  
  list.innerHTML = pageItems.map((c, i) => {
    const proto = c.protocol || 'unknown';
    const idx = start + i;
    return `
      <div class="config-item">
        <div class="config-info">
          <span class="badge badge-${proto}">${proto.toUpperCase()}</span>
          <div>
            <div class="host">${escapeHtml(c.host)}:${c.port}</div>
            <div style="font-size:0.75rem; color:#666; margin-top:4px;">
              ${c.network || 'tcp'} ${c.tls && c.tls !== 'none' ? '• TLS' : ''}
              ${c.latency ? '• <span class="latency">' + c.latency + ' ms</span>' : ''}
            </div>
          </div>
        </div>
        <button class="copy-btn" onclick="copyOne(${idx}, this)">کپی</button>
      </div>
    `;
  }).join('');
  
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  
  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(1)">اول</button>`;
  html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">قبلی</button>`;
  
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  
  for (let i = start; i <= end; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">بعدی</button>`;
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${totalPages})">آخر</button>`;
  
  pag.innerHTML = html;
}

function goPage(n) {
  currentPage = n;
  renderList();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ========== کپی ==========
async function copyOne(idx, btn) {
  try {
    await navigator.clipboard.writeText(filteredConfigs[idx].config);
    btn.textContent = '✓ کپی شد';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'کپی';
      btn.classList.remove('copied');
    }, 1500);
  } catch (e) {
    alert('خطا در کپی');
  }
}

async function copyAll() {
  if (filteredConfigs.length === 0) return alert('لیست خالیه');
  const text = filteredConfigs.map(c => c.config).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    alert(`✅ ${filteredConfigs.length} کانفیگ کپی شد`);
  } catch (e) {
    alert('خطا در کپی');
  }
}

function downloadSub() {
  if (filteredConfigs.length === 0) return alert('لیست خالیه');
  const text = filteredConfigs.map(c => c.config).join('\n');
  // base64 encode برای subscription
  const b64 = btoa(unescape(encodeURIComponent(text)));
  const blob = new Blob([b64], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'subscription.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ========== شروع ==========
loadData();
// بروزرسانی خودکار هر ۶۰ ثانیه
setInterval(loadData, 60000);
</script>
</body>
</html>
